<style>

:root[data-theme="dark"]{--bg:#161615;--card:#212120;--text:#eeeeea;--muted:#9a9a93;--line:#34342f;--land:#2b3327;--sea:#1b2530;--blue:#6aa2ff}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:12px 16px 0}
h1{font-size:19px;margin:0}header p{margin:2px 0 8px;color:var(--muted);font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:var(--text)}
.b{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.b[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.sp{flex:1}
.app{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:14px;padding:12px 16px 20px}
#page{display:block;padding:12px 16px 20px;max-width:1000px;margin:0 auto}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.row{display:flex;gap:6px;flex-wrap:wrap}.row select{flex:1;min-width:120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 290px);min-height:160px;overflow:auto}
.item{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}
.item.sel,.item:hover{border-color:var(--text)}.item small{display:block;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.mapwrap{background:var(--sea);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:8px;height:calc(100vh - 110px);min-height:420px}
#map{width:100%;height:100%;background:var(--sea)}
.pin{width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 12px/22px system-ui,sans-serif;text-align:center;box-shadow:0 1px 4px #0006}
.pin.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px #111}
#detail:not(:empty){position:absolute;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.35)}
#detail .card{width:min(580px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 30px #0006}
.jump{position:absolute;z-index:1000;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;margin:0 4px 4px 0;border:1px solid var(--line)}
.tag.c{color:#fff;border:0}.ok{background:#2e9e6b;color:#fff;border:0}.am{background:#d99a1e;color:#fff;border:0}.rd{background:#d94a38;color:#fff;border:0}
h2{margin:0 0 4px;font-size:17px}.x{float:right;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
dl{margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}dt{color:var(--muted)}dd{margin:0;word-break:break-word}
a{color:var(--blue)}.v{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.v small,.note{color:var(--muted);font-size:12px}
.v img{max-width:100%;border-radius:8px;margin:4px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line)}
@media (max-width:760px){#detail:not(:empty){position:fixed;z-index:3000}#detail .card{max-height:90vh}.app{grid-template-columns:1fr}.mapwrap{position:static;height:55vh;min-height:300px;order:-1}.list{max-height:none}}
</style></head><body>
